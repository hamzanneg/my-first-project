<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign up</title>

<style>
    body {
        background-color: lightblue;
    }
    
    
    form {
       
        align-items: center;
        justify-content: center;
        display: flex;
        min-height: 100vh;
    }
    fieldset {
        text-align: center;
        width: 25%;
        border-radius: 25px;
        
        box-shadow: 0 0 10px 0;
        background-color: white;
        
    }
    button {
        width: 60%;
        height: 40px;
        border-radius: 5px;
        font-size: medium;
        background-color: rgb(78, 78, 204);
        font-weight: bold;
        color: white;
        box-shadow: 0 0 0px 0;
    }
</style>

</head>

<body>
    <form>
        <fieldset>
           
            <h1 style="text-align: center;">Sign Up</h1>
        
            

            <p style="position: relative; right: 85px; font-weight: bold; margin-bottom: 0;">Email:</p>
            <input type="email" placeholder="exemple@gmail.com" style="font-size: 17.5px;">


            <p style="position: relative; right: 70px; font-weight: bold; margin-bottom: 0;">Password:</p>
            <input type="password" placeholder="Password" style="font-size: 17.5px;">

            <br><br>

            <a href="google.com" style="position: relative; left: 125px;">forget password?</a>
            <label style="position:relative; right: 125px;">Remember me</label>
            <input type="checkbox" style="position: relative; right: 125px;">

            <br><br>

            <button>Sign up</button>

            <br><br>

            <label>Don't have an account?</label>
            <a href="google.com">Sign up</a>
        </fieldset>
    </form>
</body>
</html>
